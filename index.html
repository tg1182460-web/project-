<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0D12;
    --bg-2:#0D1017;
    --surface:#131822;
    --surface-2:#1A212C;
    --border:#242C38;
    --border-soft:#1C232E;
    --gold:#C9A227;
    --gold-soft:#E4C766;
    --green:#3FA66B;
    --green-soft:#7FCB9C;
    --red:#C15C4E;
    --amber:#D2A23A;
    --text:#EDEFF3;
    --text-dim:#8D97A6;
    --text-dimmer:#5C6572;
    --radius:16px;
    --radius-sm:10px;
    --font-display:'Cairo',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg);color:var(--text);font-family:'Tajawal',sans-serif;}
  body{min-height:100vh;overflow-x:hidden;}
  #app{min-height:100vh;position:relative;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,textarea{font-family:inherit;}
  ::selection{background:var(--gold);color:#0A0D12;}

  .container{max-width:1080px;margin:0 auto;padding:0 24px;}
  .bg-glow{
    position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(ellipse 900px 500px at 15% -5%, rgba(201,162,39,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 90% 10%, rgba(63,166,107,0.07), transparent 60%);
  }

  /* NAV */
  .nav{
    position:sticky;top:0;z-index:50;
    background:rgba(10,13,18,0.72);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border-soft);
  }
  .nav-inner{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;max-width:1080px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;}
  .brand-mark{width:34px;height:34px;flex-shrink:0;}
  .nav-cta{
    background:var(--gold);color:#1A1305;font-weight:700;font-size:14px;
    padding:9px 20px;border-radius:999px;transition:transform .15s ease, box-shadow .15s ease;
  }
  .nav-cta:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(201,162,39,0.25);}

  /* LANDING */
  .hero{padding:88px 0 40px;text-align:center;position:relative;z-index:1;}
  .hero-stage{position:relative;height:280px;margin-bottom:8px;}
  .hero-stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;opacity:0;transition:opacity 1s ease;}
  .hero-stage canvas.ready{opacity:1;}
  .hero-stage-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;}
  .fallback-gem{width:120px;height:120px;position:relative;animation:gemSpin 9s linear infinite;transform-style:preserve-3d;}
  .fallback-gem i{position:absolute;inset:0;border-radius:22px;background:linear-gradient(135deg,var(--gold),#7a5f14);
    box-shadow:0 30px 60px rgba(201,162,39,0.25);}
  .fallback-gem i:nth-child(1){transform:rotateY(0deg) translateZ(60px);}
  .fallback-gem i:nth-child(2){transform:rotateY(90deg) translateZ(60px);opacity:.75;}
  .fallback-gem i:nth-child(3){transform:rotateX(90deg) translateZ(60px);opacity:.55;}
  @keyframes gemSpin{from{transform:rotateY(0deg) rotateX(8deg);}to{transform:rotateY(360deg) rotateX(8deg);}}
  .eyebrow{display:inline-block;font-size:13px;color:var(--gold-soft);border:1px solid rgba(201,162,39,0.35);
    padding:6px 16px;border-radius:999px;margin-bottom:28px;background:rgba(201,162,39,0.06);}
  .hero h1{font-family:var(--font-display);font-size:46px;line-height:1.3;font-weight:900;max-width:820px;margin:0 auto 20px;letter-spacing:-0.5px;}
  .hero p{font-size:18px;color:var(--text-dim);max-width:600px;margin:0 auto 36px;line-height:1.8;font-weight:400;}
  .hero-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  .btn-primary{
    background:var(--gold);color:#1A1305;font-weight:700;font-size:15px;padding:15px 32px;border-radius:999px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(201,162,39,0.28);}
  .btn-ghost{
    border:1px solid var(--border);color:var(--text);font-weight:500;font-size:15px;padding:15px 28px;border-radius:999px;
    transition:border-color .15s ease, background .15s ease;
  }
  .btn-ghost:hover{border-color:var(--text-dim);background:var(--surface);}

  .tagline-strip{text-align:center;padding:20px 0 80px;color:var(--text-dimmer);font-size:15px;position:relative;z-index:1;}

  /* HOW IT WORKS */
  .section{padding:70px 0;position:relative;z-index:1;}
  .section-head{text-align:center;margin-bottom:48px;}
  .section-head h2{font-family:var(--font-display);font-size:30px;font-weight:900;margin-bottom:10px;}
  .section-head p{color:var(--text-dim);font-size:15px;}
  .steps-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;perspective:1000px;}
  @media(max-width:860px){.steps-grid{grid-template-columns:1fr 1fr;}}
  @media(max-width:560px){.steps-grid{grid-template-columns:1fr;}}
  .step-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:26px 22px;
    transform-style:preserve-3d;transition:transform .12s ease,border-color .2s ease,box-shadow .2s ease;will-change:transform;}
  .step-card:hover{border-color:rgba(201,162,39,0.4);box-shadow:0 20px 40px -18px rgba(0,0,0,0.55);}
  .step-num{font-size:13px;color:var(--gold-soft);font-weight:700;margin-bottom:14px;letter-spacing:0.5px;}
  .step-card h3{font-size:17px;font-weight:700;margin-bottom:8px;}
  .step-card p{font-size:14px;color:var(--text-dim);line-height:1.7;}

  .footer{border-top:1px solid var(--border-soft);padding:32px 0;text-align:center;color:var(--text-dimmer);font-size:13px;position:relative;z-index:1;}

  /* CONSULT SCREENS */
  .center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;z-index:1;}
  .consult-card{
    width:100%;max-width:640px;background:var(--surface);border:1px solid var(--border-soft);
    border-radius:20px;padding:40px;
  }
  .consult-top{display:flex;align-items:center;gap:12px;margin-bottom:24px;}
  .advisor-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#8a6d16);
    display:flex;align-items:center;justify-content:center;font-weight:900;color:#1A1305;flex-shrink:0;}
  .advisor-name{font-weight:700;font-size:15px;}
  .advisor-role{font-size:12px;color:var(--text-dim);}
  .consult-msg{font-size:19px;line-height:1.8;font-weight:500;margin-bottom:22px;}
  .consult-msg b{color:var(--gold-soft);}
  textarea.idea-input{
    width:100%;min-height:130px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);
    color:var(--text);padding:16px;font-size:15px;line-height:1.7;resize:vertical;
  }
  textarea.idea-input:focus{outline:none;border-color:var(--gold);}
  .progress-bar{height:4px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-bottom:28px;}
  .progress-fill{height:100%;background:var(--gold);transition:width .4s ease;}
  .options-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;}
  .opt-btn{
    padding:12px 20px;border:1px solid var(--border);border-radius:999px;font-size:14px;background:var(--surface-2);
    transition:all .15s ease;
  }
  .opt-btn:hover{border-color:var(--gold);color:var(--gold-soft);}
  .field-row{display:flex;gap:10px;margin-top:6px;}
  .num-input{flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);
    color:var(--text);padding:14px 16px;font-size:15px;}
  .num-input:focus{outline:none;border-color:var(--gold);}
  .send-btn{background:var(--gold);color:#1A1305;font-weight:700;padding:14px 22px;border-radius:var(--radius-sm);white-space:nowrap;}
  .back-link{display:inline-block;margin-top:22px;color:var(--text-dimmer);font-size:13px;}
  .back-link:hover{color:var(--text-dim);}

  /* ANALYZING */
  .analyzing-card{width:100%;max-width:480px;text-align:center;}
  .analyzing-title{font-size:20px;font-weight:700;margin-bottom:36px;}
  .check-list{text-align:right;}
  .check-item{display:flex;align-items:center;gap:12px;padding:11px 0;color:var(--text-dimmer);font-size:15px;
    border-bottom:1px solid var(--border-soft);opacity:0;transform:translateY(6px);transition:all .35s ease;}
  .check-item.show{opacity:1;transform:translateY(0);}
  .check-item.done{color:var(--text);}
  .check-icon{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .2s ease;}
  .check-item.done .check-icon{background:var(--green);border-color:var(--green);color:#08130D;}

  /* PAYWALL */
  .paywall-overlay{
    position:fixed;inset:0;background:rgba(8,10,14,0.86);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  .paywall-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:20px;padding:36px;max-width:420px;width:100%;}
  .paywall-card h3{font-size:20px;font-weight:900;margin-bottom:10px;}
  .paywall-card p{color:var(--text-dim);font-size:14px;line-height:1.8;margin-bottom:20px;}
  .price-tag{display:flex;align-items:baseline;gap:6px;margin-bottom:22px;}
  .price-tag .num{font-size:36px;font-weight:900;color:var(--gold-soft);}
  .price-tag .cur{font-size:15px;color:var(--text-dim);}
  .fawry-box{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;margin-bottom:20px;}
  .fawry-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text-dim);padding:5px 0;}
  .fawry-code{font-weight:900;color:var(--text);letter-spacing:2px;font-size:19px;direction:ltr;display:inline-block;}
  .copy-btn{border:1px solid var(--border);color:var(--gold-soft);font-size:12px;padding:5px 10px;border-radius:8px;
    background:var(--surface);transition:border-color .15s ease;}
  .copy-btn:hover{border-color:var(--gold);}
  .paywall-note{font-size:12px;color:var(--text-dimmer);margin-top:14px;text-align:center;line-height:1.7;}
  .pending-spinner{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--amber);
    display:inline-block;animation:spin 0.8s linear infinite;vertical-align:middle;margin-left:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* REPORT */
  .report-wrap{padding:40px 0 100px;position:relative;z-index:1;}
  .report-header{margin-bottom:32px;}
  .report-header .label{font-size:13px;color:var(--gold-soft);margin-bottom:8px;}
  .report-header h1{font-family:var(--font-display);font-size:28px;font-weight:900;margin-bottom:4px;}
  .report-header .sub{color:var(--text-dim);font-size:14px;}

  .score-hero{display:flex;align-items:center;gap:28px;background:var(--surface);border:1px solid var(--border-soft);
    border-radius:var(--radius);padding:30px;margin-bottom:20px;flex-wrap:wrap;}
  .score-ring{position:relative;width:110px;height:110px;flex-shrink:0;}
  .score-ring svg{transform:rotate(-90deg);}
  .score-ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;}
  .verdict-block{flex:1;min-width:220px;}
  .verdict-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;font-size:14px;font-weight:700;margin-bottom:10px;}
  .verdict-green{background:rgba(63,166,107,0.14);color:var(--green-soft);}
  .verdict-amber{background:rgba(210,162,58,0.14);color:var(--amber);}
  .verdict-red{background:rgba(193,92,78,0.14);color:#E08A7C;}
  .verdict-block .desc{color:var(--text-dim);font-size:14px;line-height:1.7;}

  .metrics-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px;perspective:900px;}
  @media(max-width:720px){.metrics-grid{grid-template-columns:1fr 1fr;}}
  @media(max-width:460px){.metrics-grid{grid-template-columns:1fr;}}
  .metric-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:18px;
    transition:transform .12s ease;will-change:transform;}
  .metric-card .name{font-size:13px;color:var(--text-dim);margin-bottom:10px;}
  .metric-card .val{font-size:22px;font-weight:900;margin-bottom:8px;}
  .mbar{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden;}
  .mbar-fill{height:100%;border-radius:999px;}

  .panel{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:28px;margin-bottom:20px;}
  .panel h2{font-family:var(--font-display);font-size:19px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
  .personal-note{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--border-soft);font-size:14px;line-height:1.8;color:var(--text-dim);}
  .personal-note:last-child{border-bottom:none;}
  .personal-note .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);flex-shrink:0;margin-top:8px;}
  .personal-note b{color:var(--text);font-weight:700;}
  .panel .lead{color:var(--text-dim);font-size:14px;line-height:1.9;margin-bottom:6px;}
  .tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:6px;margin-inline-start:8px;font-weight:700;vertical-align:middle;}
  .tag-input{background:rgba(63,166,107,0.14);color:var(--green-soft);}
  .tag-estimate{background:rgba(210,162,58,0.14);color:var(--amber);}
  .tag-assumption{background:rgba(140,150,166,0.14);color:var(--text-dim);}

  .cost-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border-soft);font-size:14px;}
  .cost-row:last-child{border-bottom:none;}
  .cost-row input{width:110px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;
    color:var(--text);padding:7px 10px;font-size:14px;text-align:center;}
  .cost-total{display:flex;justify-content:space-between;padding-top:14px;margin-top:6px;border-top:1px solid var(--border);
    font-weight:800;font-size:15px;}

  .risk-item{padding:16px 0;border-bottom:1px solid var(--border-soft);}
  .risk-item:last-child{border-bottom:none;}
  .risk-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .risk-head .name{font-weight:700;font-size:15px;}
  .risk-level{font-size:12px;padding:3px 10px;border-radius:999px;font-weight:700;}
  .risk-item p{color:var(--text-dim);font-size:13px;line-height:1.7;margin-top:4px;}
  .risk-item p b{color:var(--text);font-weight:600;}

  .checklist-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border-soft);font-size:14px;}
  .checklist-item:last-child{border-bottom:none;}
  .checkbox{width:20px;height:20px;border:1.5px solid var(--border);border-radius:6px;flex-shrink:0;display:flex;
    align-items:center;justify-content:center;font-size:12px;transition:all .15s ease;}
  .checkbox.checked{background:var(--green);border-color:var(--green);color:#08130D;}
  .checklist-item.done span.label{color:var(--text-dimmer);text-decoration:line-through;}

  .timeline{position:relative;padding-inline-start:20px;}
  .timeline::before{content:'';position:absolute;top:6px;bottom:6px;right:5px;width:2px;background:var(--border);}
  .tl-item{position:relative;padding-inline-end:22px;padding-bottom:24px;}
  .tl-item:last-child{padding-bottom:0;}
  .tl-item::before{content:'';position:absolute;right:-1px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--gold);}
  .tl-item .period{font-size:12px;color:var(--gold-soft);font-weight:700;margin-bottom:4px;}
  .tl-item .desc{font-size:14px;color:var(--text-dim);}

  .scenario-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .scenario-tab{padding:8px 16px;border-radius:999px;font-size:13px;border:1px solid var(--border);color:var(--text-dim);}
  .scenario-tab.active{background:var(--surface-2);color:var(--text);border-color:var(--gold);}
  .sliders{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px;}
  @media(max-width:560px){.sliders{grid-template-columns:1fr;}}
  .slider-group label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:6px;}
  .slider-group .sval{color:var(--gold-soft);font-weight:700;}
  .slider-group input[type=range]{width:100%;accent-color:var(--gold);}
  .fin-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px;}
  @media(max-width:720px){.fin-summary{grid-template-columns:1fr 1fr;}}
  .fin-box{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;text-align:center;}
  .fin-box .l{font-size:12px;color:var(--text-dim);margin-bottom:6px;}
  .fin-box .v{font-size:17px;font-weight:800;}

  .alt-card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:18px;margin-bottom:12px;}
  .alt-card h4{font-size:15px;font-weight:700;margin-bottom:6px;}
  .alt-card p{font-size:13px;color:var(--text-dim);line-height:1.7;}

  .disclaimer{font-size:12px;color:var(--text-dimmer);line-height:1.8;padding:16px;border:1px dashed var(--border);border-radius:var(--radius-sm);margin-top:8px;}

  .empty-note{font-size:13px;color:var(--text-dim);background:var(--surface-2);border:1px solid var(--border);
    border-radius:var(--radius-sm);padding:14px 16px;line-height:1.8;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" onerror="window.__THREE_FAILED=true"></script>

<body>
<div class="bg-glow"></div>
<div id="app"></div>

<script>
/* ---------------- STATE ---------------- */
const state = {
  screen: 'landing',
  idea: '',
  type: null,
  qIndex: 0,
  answers: {},
  analyzeStep: 0,
  paid: false,
  checklist: {},
  scenario: { customers: 90, price: 65, rent: 12000, salaries: 15000 },
  scenarioMode: 'expected'
};

/* ---------------- QUESTION SETS ---------------- */
const COMMON_Q = [
  { key:'location', q:'تمام، فهمت فكرتك. فين ناوي تنفذ المشروع؟', type:'choice', options:['سوهاج','القاهرة','الإسكندرية','مدينة أخرى'] },
  { key:'capital', q:'تقريبًا كام رأس المال المتاح للمشروع؟ (بالجنيه المصري)', type:'number', placeholder:'مثال: 300000' },
  { key:'has_place', q:'هل عندك مكان بالفعل، ولا لسه بتدوّر؟', type:'choice', options:['عندي مكان بالفعل','لسه بدوّر'] },
  { key:'experience', q:'هل عندك خبرة سابقة في هذا المجال؟', type:'choice', options:['نعم، عندي خبرة','لا، أول مرة'] },
];

/* Questions inserted only when relevant to what the person already answered */
function dynamicFollowUps(type, a){
  const extra = [];
  if(a.location === 'مدينة أخرى'){

/* ---------------- HELPERS ---------------- */
function detectType(idea){
  const t = idea.toLowerCase();
  if(/(مطعم|كافيه|كافية|برجر|أكل|مطبخ|كوفي|مقهى)/.test(idea)) return 'restaurant';
  if(/(متجر|أونلاين|اونلاين|تجارة إلكترونية|بيع منتجات|ستور|شحن)/.test(idea)) return 'ecommerce';
  if(/(مصنع|تصنيع|إنتاج|مصنّع)/.test(idea)) return 'factory';
  return 'generic';
}
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function fmt(n){ return Math.round(n).toLocaleString('en-US'); }
function seedFromString(s){ let h=0; for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0;} return h; }

function computeReport(){
  const a = state.answers;
  const type = state.type;
  const capital = Number(a.capital)||0;
  const baseline = BASELINE_CAPITAL[type];
  const ratio = clamp(capital/baseline, 0, 2.2);
  const seed = seedFromString(state.idea + type) % 17;

  let financial = clamp(30 + ratio*48 + seed*0.3, 15, 94);
  const bigCity = a.location==='القاهرة' || a.location==='الإسكندرية';
  let market = bigCity ? 74 + (seed%9) : 62 + (seed%10);
  let competition = bigCity ? 100-(60+(seed%12)) + 40 : 100-(45+(seed%10)) + 40; // favorability (higher=better)
  competition = clamp(bigCity ? 58+(seed%8) : 70+(seed%8), 30, 92);
  let hasExp = a.experience === 'نعم، عندي خبرة';
  let hasPlace = a.has_place === 'عندي مكان بالفعل';
  let ideaStrength = clamp(58 + (hasExp?10:0) + (seed%14) + (ratio>0.8?6:0), 20, 95);
  let riskLevel = clamp(70 - ratio*30 - (hasExp?12:0) - (hasPlace?6:0) + (seed%10), 8, 88);

  const overall = Math.round(
    financial*0.28 + market*0.2 + competition*0.16 + (100-riskLevel)*0.18 + ideaStrength*0.18
  );

  let verdict = 'red', verdictText='المخاطرة مرتفعة حاليًا';
  if(overall>=72){ verdict='green'; verdictText='يمكن دراسة التنفيذ'; }
  else if(overall>=48){ verdict='amber'; verdictText='اختبر الفكرة أولًا'; }

  return {
    overall, financial:Math.round(financial), market:Math.round(market),
    competition:Math.round(competition), risk:Math.round(riskLevel),
    idea:Math.round(ideaStrength), verdict, verdictText,
    capital, baseline, hasExp, hasPlace
  };
}

function defaultCosts(report){
  const b = report.baseline;
  return {
    'إيجار / مقدم': Math.round(b*0.12),
    'تجهيز وديكور': Math.round(b*0.28),
    'معدات': Math.round(b*0.22),
    'تراخيص': Math.round(b*0.04),
    'مخزون أولي': Math.round(b*0.14),
    'أثاث': Math.round(b*0.08),
    'تسويق الإطلاق': Math.round(b*0.05),
    'احتياطي طوارئ': Math.round(b*0.07),
  };
}

function metricCard(name, val, isRisk){
  const color = isRisk ? (val>60?'#C15C4E':val>35?'var(--amber)':'var(--green)') : scoreColor(val);
  return `<div class="metric-card"><div class="name">${name}</div><div class="val">${val}/100</div>
    <div class="mbar"><div class="mbar-fill" style="width:${val}%;background:${color}"></div></div></div>`;
}
function scoreColor(v){ return v>=70?'var(--green)':v>=45?'var(--amber)':'#C15C4E'; }

function advisorOpinion(r){
  const parts = [];
  parts.push(r.capital>=r.baseline*0.9
    ? `رأس المال المتاح قريب من الحجم المعتاد لهذا النوع من المشاريع، وده بيقلل ضغط التمويل في البداية.`
    : `رأس المال المتاح أقل من المعتاد لهذا النوع من المشاريع، وده بيرفع الحاجة لتقليل التكاليف الأولية أو البدء بنطاق أصغر.`);
  parts.push(r.hasExp
    ? `وجود خبرة سابقة في المجال نقطة قوة حقيقية بتقلل احتمالية أخطاء التشغيل.`
    : `عدم وجود خبرة سابقة يستدعي حذر أكبر في القرارات التشغيلية الأولى، أو الاستعانة بشريك أو موظف خبير.`);
  parts.push(r.market>=70
    ? `الموقع المختار عمومًا بيدعم فرصة سوقية أعلى، لكن ده بييجي غالبًا مع منافسة أقوى.`
    : `الموقع المختار أقل ازدحامًا بالمنافسين، لكن حجم الطلب فيه محتاج يتفحّص ميدانيًا قبل الالتزام الكامل.`);
  return parts.join(' ');
}
function keyTestPoint(r){
  if(r.risk>60) return 'اختبار حجم الطلب الفعلي في المنطقة قبل أي التزام مالي كبير — عن طريق عرض تجريبي محدود أو استطلاع مباشر للعملاء المحتملين.';
  if(r.financial<50) return 'إعادة حساب التكاليف الأولية بدقة أكبر ومقارنتها برأس المال المتاح فعليًا قبل التوقيع على أي التزامات.';
  return 'تجربة نسخة مصغّرة من المشروع لفترة محدودة لقياس رد فعل العملاء الحقيقي قبل التوسع الكامل.';
}

function buildRisks(r){
  const typeRisk = {
    restaurant:{name:'تقلب تكلفة المواد الخام', reason:'أسعار اللحوم والخضروات والمستلزمات الغذائية تتغير باستمرار وتؤثر مباشرة على هامش الربح.', mitigation:'التعاقد مع أكثر من مورد وتثبيت الأسعار لفترات محددة عند الإمكان.'},
    ecommerce:{name:'الاعتماد الكامل على الإعلانات المدفوعة', reason:'ارتفاع تكلفة الإعلانات ممكن يأكل هامش الربح بسرعة خصوصًا في البداية.', mitigation:'بناء قناة تواصل مباشرة مع العملاء (مثل قائمة بريدية) لتقليل الاعتماد على الإعلانات وحدها.'},
    factory:{name:'تعقيد التراخيص والتصاريح', reason:'الأنشطة الصناعية غالبًا تحتاج تراخيص متعددة قد تؤخر بدء التشغيل الفعلي.', mitigation:'البدء في إجراءات الترخيص مبكرًا وبالتوازي مع باقي التجهيزات.'},
    generic:{name:'غموض نموذج الإيرادات', reason:'عدم وضوح كيفية تحقيق الدخل بشكل دقيق يزيد صعوبة التخطيط المالي.', mitigation:'تحديد مصدر دخل رئيسي واحد واختباره فعليًا قبل إضافة مصادر أخرى.'},
  };
  return [
    {name:'المنافسة', level: r.competition<60?'مرتفع':r.competition<78?'متوسط':'منخفض', reason:'دخول منافسين جدد أو وجود لاعبين قدامى في نفس المنطقة يقلل حصة السوق المتاحة.', mitigation:'التركيز على ميزة تنافسية واضحة بدل منافسة السعر فقط.'},
    {name:'ارتفاع الإيجار أو تكلفة المكان', level: r.financial<55?'مرتفع':'متوسط', reason:'الإيجار من أكبر الالتزامات الثابتة شهريًا، وارتفاعه يضغط على التعادل المالي.', mitigation:'التفاوض على عقد إيجار مرن أو البدء بمساحة أصغر.'},
    {name:'ضعف الطلب الفعلي', level: r.market<60?'مرتفع':'متوسط', reason:'الطلب المتوقع نظريًا قد يختلف عن السلوك الفعلي للعملاء في المنطقة.', mitigation:'اختبار الفكرة على نطاق محدود قبل الالتزام الكامل.'},
    {name:'نقص رأس المال أثناء التشغيل', level: r.capital<r.baseline?'مرتفع':'منخفض', reason:'كثير من المشاريع تفشل ليس بسبب الفكرة بل بسبب نفاد السيولة في الأشهر الأولى.', mitigation:'الاحتفاظ باحتياطي نقدي يغطي 3 أشهر تشغيل على الأقل.'},
    typeRisk[state.type] || typeRisk.generic,
  ];
}

function buildRecommendations(r){
  const recs = [];
  if(r.financial<55) recs.push('إعادة النظر في حجم المشروع في مرحلته الأولى لتقليل التكاليف الثابتة.');
  if(r.competition<60) recs.push('إضافة ميزة تنافسية واضحة تميزك عن المنافسين الحاليين في المنطقة.');
  if(!r.hasExp) recs.push('الاستعانة بموظف أو شريك لديه خبرة عملية مباشرة في هذا المجال.');
  if(r.market<60) recs.push('اختبار الفكرة فعليًا في نطاق محدود (Pilot) قبل الالتزام بالتوسع الكامل.');
  recs.push('بناء نظام محاسبة بسيط منذ اليوم الأول لمتابعة التدفق النقدي أولًا بأول.');
  recs.push('تحديد ميزانية تسويق واضحة للثلاثة أشهر الأولى بدل الإنفاق العشوائي.');
  return recs.slice(0,5);
}

function personalNotes(a, type, r){
  const notes = [];
  if(a.target_customer) notes.push(`بما إن عميلك المستهدف هو "<b>${a.target_customer}</b>"، خلي كل قرارات المكان والتسعير والتسويق موجهة لنفس الفئة دي تحديدًا، مش لجمهور عام.`);
  if(a.main_goal === 'مصدر دخلي الرئيسي') notes.push(`بما إن المشروع هيبقى <b>مصدر دخلك الرئيسي</b>، لازم يكون عندك احتياطي مالي يغطي مصاريفك الشخصية 3-6 شهور مستقلة تمامًا عن رأس مال المشروع.`);
  else if(a.main_goal === 'دخل إضافي جنب شغلي') notes.push(`بما إنه <b>دخل إضافي</b> جنب شغلك، ابدأ بأقل نطاق ممكن يثبت الفكرة، ومتستعجلش في التوسع لحد ما تتأكد من الوقت المتاح ليك فعليًا.`);
  if(a.marketing_budget === 'لأ لسه') notes.push(`محتاج تحدد رقم واضح لميزانية التسويق الشهرية من دلوقتي، حتى لو صغير، عشان متبقاش بتصرف عشوائي بعد الإطلاق.`);
  if(a.mentor_need === 'أيوه مهتم بده') notes.push(`بما إنك حابب تتعلم من حد خبير قبل البدء، حاول توصل لشخص أو استشاري في نفس المجال ولو لجلسة واحدة قبل ما تلتزم بأي مصاريف كبيرة.`);
  if(a.funding_plan) notes.push(`بخصوص تغطية الفرق في رأس المال، اخترت "<b>${a.funding_plan}</b>" — تأكد إن الخطة دي واقعية زمنيًا قبل ما تحدد موعد إطلاق نهائي.`);
  if(a.risk_tolerance === 'ده هيكون خطر كبير عليا') notes.push(`بما إن تعثر المشروع هيكون ضغط كبير عليك ماليًا، الأنسب تبدأ بنسخة أصغر بكتير من الفكرة وتوسع تدريجيًا بدل ما تلتزم برأس المال كله من أول يوم.`);
  else if(a.risk_tolerance === 'أيوه عندي احتياطي كافي') notes.push(`وجود احتياطي مالي كافي عندك ميزة حقيقية — استخدمها في اختبار الفكرة لمدة كافية بدل التسرع في الحكم عليها من أول شهر.`);
  if(a.place_timeline === 'أكتر من 3 شهور') notes.push(`مدة البحث عن مكان اللي حددتها طويلة نسبيًا — ابدأ فعليًا في المعاينة من الأسبوع الأول عشان الجدول الزمني كله متتأخرش وراها.`);
  if(type==='restaurant' && a.cuisine) notes.push(`بالنسبة لـ"<b>${a.cuisine}</b>"، تأكد إنك درست تكلفة المكون الرئيسي في الوصفة كويس، لأنه غالبًا أكبر بند في تكلفة التشغيل الشهرية.`);
  if(type==='ecommerce' && a.platform==='منصات زي جوميا ونون') notes.push(`البيع عبر منصات جاهزة بيوفر عليك تكلفة بناء متجر، لكن خد بالك من نسبة العمولة اللي بتاخدها المنصة من كل عملية بيع وهي بتأثر على هامش ربحك.`);
  if(type==='ecommerce' && a.stock_model==='طلب عند الطلب') notes.push(`نظام الطلب عند الطلب بيقلل مخاطرة تجميد فلوسك في مخزون، لكنه غالبًا بياخد وقت تسليم أطول — وضّح ده للعميل من البداية عشان تتجنب الشكاوى.`);
  if(type==='factory' && a.target_market==='محليًا + تصدير لاحقًا') notes.push(`التصدير هدف كويس، لكن ركز الأولوية على تثبيت السوق المحلي وجودة الإنتاج الأول، والتصدير يتحط كمرحلة تالية له متطلباتها الخاصة.`);
  if(type==='generic' && a.customer_acquisition) notes.push(`خطتك للوصول لأول عملاء ("<b>${a.customer_acquisition}</b>") نقطة كويسة تتبدأ بيها، لكن حاول تحدد رقم مستهدف واضح (مثلاً أول 10 عملاء خلال شهر) عشان تقدر تقيس تقدمك فعليًا.`);
  return notes;
}

      {name:'مطبخ سحابي (Cloud Kitchen) للدليفري فقط', why:'يقلل تكلفة الإيجار والديكور بشكل كبير مقارنة بمطعم صالة كاملة، ويناسب رأس المال الحالي أكثر.'},
      {name:'خدمة تموين لمناسبات صغيرة', why:'يستفيد من نفس الخبرة والمعدات المتوقعة، لكن بمخاطرة أقل والتزامات تشغيلية أقل ثباتًا.'},
    ],
    ecommerce:[
      {name:'البيع عبر منصات جاهزة قبل متجر مستقل', why:'يقلل تكلفة البناء والتسويق التقني في البداية، ويسمح باختبار الطلب على المنتج بسرعة أكبر.'},
      {name:'نموذج الطلب المسبق (Pre-order)', why:'يقلل المخاطرة المرتبطة بتجهيز مخزون كبير قبل التأكد من الطلب الفعلي.'},
      {name:'التركيز على فئة منتجات أضيق وأعمق', why:'يقلل تعقيد إدارة المخزون والموردين مقارنة بتشكيلة واسعة من المنتجات.'},
    ],
    factory:[
      {name:'التصنيع بالتعاقد مع مصنع قائم (Contract Manufacturing)', why:'يقلل الحاجة لرأس مال ضخم في المعدات والمكان في المرحلة الأولى.'},
      {name:'ورشة إنتاج صغيرة بدل مصنع كامل', why:'يسمح باختبار جودة المنتج والطلب عليه قبل الاستثمار في طاقة إنتاجية كبيرة.'},
      {name:'التوزيع بدل التصنيع المباشر في البداية', why:'يقلل المخاطرة التشغيلية والتراخيص المطلوبة مع الاستفادة من نفس معرفة السوق.'},
    ],
    generic:[
      {name:'نسخة مصغّرة (MVP) من نفس الفكرة', why:'تسمح باختبار الفرضية الأساسية للمشروع بأقل تكلفة ممكنة قبل التوسع.'},
      {name:'تقديم الخدمة/المنتج كـ Freelance قبل تأسيس كيان كامل', why:'يقلل الالتزامات الثابتة ريثما يتأكد الطلب الفعلي.'},
      {name:'شراكة مع طرف لديه خبرة تكميلية', why:'تقلل فجوة الخبرة الحالية وتوزع المخاطرة بين طرفين.'},
    ],
  };
  return alts[state.type] || alts.generic;
}

/* scenario chart (simple SVG bar chart) */
function renderScenarioChart(){
  const el = document.getElementById('scenarioChart');
  if(!el) return;
  const s = state.scenario;
  const days = 30;
  const revenue = s.customers * s.price * days;
  const expenses = (s.rent + s.salaries) + s.customers*days*(s.price*0.35);
  const profit = revenue - expenses;
  const scenarios = [
    {label:'متحفظ', mult:0.7, color:'#C15C4E'},
    {label:'متوقع', mult:1, color:'#D2A23A'},
    {label:'متفائل', mult:1.3, color:'#3FA66B'},
  ];
  const vals = scenarios.map(sc=>Math.round((revenue*sc.mult) - expenses));
  const maxAbs = Math.max(...vals.map(v=>Math.abs(v)), 1000);
  const barsHtml = scenarios.map((sc,i)=>{
    const h = Math.round((Math.abs(vals[i])/maxAbs)*90);
    return `<div style="display:flex;flex-direction:column;align-items:center;flex:1;">
      <div style="font-size:12px;color:${vals[i]>=0?'var(--green-soft)':'#E08A7C'};font-weight:700;margin-bottom:6px;">${fmt(vals[i])} ج.م</div>
      <div style="width:100%;max-width:70px;height:100px;display:flex;align-items:flex-end;justify-content:center;">
        <div style="width:100%;height:${h}%;background:${sc.color};border-radius:6px 6px 0 0;"></div>
      </div>
      <div style="font-size:12px;color:var(--text-dim);margin-top:8px;">${sc.label}</div>
    </div>`;
  }).join('');
  el.innerHTML = `<div style="display:flex;gap:14px;align-items:flex-end;padding:10px 0 4px;">${barsHtml}</div>
    <div class="fin-summary">
      <div class="fin-box"><div class="l">الإيرادات الشهرية</div><div class="v">${fmt(revenue)} ج.م</div></div>
      <div class="fin-box"><div class="l">المصروفات الشهرية</div><div class="v">${fmt(expenses)} ج.م</div></div>
      <div class="fin-box"><div class="l">صافي الربح المتوقع</div><div class="v" style="color:${profit>=0?'var(--green-soft)':'#E08A7C'}">${fmt(profit)} ج.م</div></div>
      <div class="fin-box"><div class="l">فترة استرداد رأس المال</div><div class="v">${profit>0?Math.max(1,Math.round((state._costs?Object.values(state._costs).reduce((a,b)=>a+b,0):r_baseline())/profit))+' شهر':'—'}</div></div>
    </div>`;
}
function r_baseline(){ return BASELINE_CAPITAL[state.type]; }

/* ---------------- 3D HERO + TILT ---------------- */
let heroAnim = null;
function init3DHero(){
  const canvas = document.getElementById('heroCanvas');
  const fallback = document.getElementById('heroFallback');
  if(!canvas) return;
  if(typeof THREE === 'undefined' || window.__THREE_FAILED){
    if(fallback) fallback.style.display = 'flex';
    return;
  }
  if(fallback) fallback.style.display = 'none';
  const stage = document.getElementById('heroStage');
  const w = stage.clientWidth, h = stage.clientHeight;

  const renderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:true });
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, w/h, 0.1, 100);
  camera.position.set(0, 0, 7);

  const geo = new THREE.IcosahedronGeometry(2, 0);
  const mat = new THREE.MeshStandardMaterial({ color:0xC9A227, metalness:0.75, roughness:0.25, flatShading:true });
  const gem = new THREE.Mesh(geo, mat);
  scene.add(gem);

  const wireGeo = new THREE.IcosahedronGeometry(2.35, 0);
  const wireMat = new THREE.MeshBasicMaterial({ color:0xE4C766, wireframe:true, transparent:true, opacity:0.25 });
  const wire = new THREE.Mesh(wireGeo, wireMat);
  scene.add(wire);

  scene.add(new THREE.AmbientLight(0x555566, 1.2));
  const light1 = new THREE.PointLight(0xE4C766, 1.4);
  light1.position.set(4, 5, 6);
  scene.add(light1);
  const light2 = new THREE.PointLight(0x3FA66B, 0.6);
  light2.position.set(-5, -3, 2);
  scene.add(light2);

  let mouseX = 0, mouseY = 0;
  const onMove = (e)=>{
    const r = stage.getBoundingClientRect();
    mouseX = ((e.clientX - r.left)/r.width - 0.5);
    mouseY = ((e.clientY - r.top)/r.height - 0.5);
  };
  window.addEventListener('mousemove', onMove);

  let raf;
  function animate(){
    gem.rotation.y += 0.006;
    gem.rotation.x += 0.002;
    wire.rotation.y += 0.004;
    wire.rotation.x -= 0.002;
    camera.position.x += (mouseX*2 - camera.position.x)*0.03;
    camera.position.y += (-mouseY*1.2 - camera.position.y)*0.03;
    camera.lookAt(0,0,0);
    renderer.render(scene, camera);
    raf = requestAnimationFrame(animate);
  }
  animate();
  requestAnimationFrame(()=>canvas.classList.add('ready'));

  heroAnim = { cleanup(){
    cancelAnimationFrame(raf);
    window.removeEventListener('mousemove', onMove);
    renderer.dispose();
  }};
}

function attachTilt(selector){
  document.querySelectorAll(selector).forEach(card=>{
    card.addEventListener('mousemove', (e)=>{
      const r = card.getBoundingClientRect();
      const px = (e.clientX - r.left)/r.width - 0.5;
      const py = (e.clientY - r.top)/r.height - 0.5;
      card.style.transform = `perspective(700px) rotateX(${(-py*8).toFixed(2)}deg) rotateY(${(px*8).toFixed(2)}deg) translateZ(4px)`;
    });
    card.addEventListener('mouseleave', ()=>{ card.style.transform = ''; });
  });
}

/* ---------------- HANDLERS ---------------- */
function attachHandlers(){
  document.querySelectorAll('[data-go]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.screen = el.getAttribute('data-go'); render(); });
  });

  if(state.screen==='consult-start'){
    document.getElementById('startSessionBtn').addEventListener('click', ()=>{
      const val = document.getElementById('ideaInput').value.trim();
      if(!val) return;
      state.idea = val;
      state.type = detectType(val);
      state.qIndex = 0;
      state.answers = {};
      state.screen = 'consult-flow';
      render();
    });
  }

  if(state.screen==='consult-flow'){
    const qs = questionSet(state.type);
    const q = qs[state.qIndex];
    document.querySelectorAll('[data-answer]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        state.answers[q.key] = btn.getAttribute('data-answer');
        advanceQuestion(qs);
      });
    });
    const sendBtn = document.getElementById('sendAnswer');
    if(sendBtn){
      sendBtn.addEventListener('click', ()=>{
        const v = document.getElementById('qInput').value.trim();
        if(!v) return;
        state.answers[q.key] = v;
        advanceQuestion(qs);
      });
    }
  }

  if(state.screen==='analyzing'){
    runAnalyzingSequence();
  }

  if(state.screen==='report'){
    renderScenarioChart();
    ['customers','price','rent','salaries'].forEach(k=>{
      const inp = document.getElementById('s_'+k);
      inp.addEventListener('input', ()=>{
        state.scenario[k] = Number(inp.value);
        document.getElementById('v_'+k).textContent = k==='rent'||k==='salaries' ? fmt(inp.value) : inp.value;
        renderScenarioChart();
      });
    });
    document.querySelectorAll('[data-cost-key]').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        state._costs[inp.getAttribute('data-cost-key')] = Number(inp.value)||0;
        const total = Object.values(state._costs).reduce((a,b)=>a+b,0);
        document.getElementById('costTotal').textContent = fmt(total)+' ج.م';
        document.getElementById('costTotal2').textContent = fmt(total)+' ج.م';
        const r = computeReport();
        document.getElementById('costDiff').textContent = fmt(Math.abs(r.capital-total))+' ج.م';
      });
    });
    document.querySelectorAll('[data-check]').forEach(cb=>{
      cb.addEventListener('click', ()=>{
        const idx = cb.getAttribute('data-check');
        state.checklist[idx] = !state.checklist[idx];
        cb.classList.toggle('checked', !!state.checklist[idx]);
        cb.textContent = state.checklist[idx] ? '✓' : '';
        cb.closest('.checklist-item').classList.toggle('done', !!state.checklist[idx]);
      });
    });
  }
}

function advanceQuestion(qs){
  if(state.qIndex < qs.length-1){
    state.qIndex++;
    render();
  } else {
    state.screen = 'analyzing';
    state.analyzeStep = 0;
    render();
  }
}

function runAnalyzingSequence(){
  const items = document.querySelectorAll('.check-item');
  let i = 0;
  function step(){
    if(i>0) items[i-1].classList.add('done');
    if(i < items.length){
      items[i].classList.add('show');
      i++;
      setTimeout(step, 420);
    } else {
      setTimeout(()=>{ showPaywall(); }, 500);
    }
  }
  step();
}

const INSTAPAY_NUMBER = '01155566543';
/* If you generate a fixed-amount "collect request" link from inside your own InstaPay
   app (looks like https://ipn.eg/S/...), paste it here — that's the only way a button
   can open InstaPay with the recipient & amount already filled in for you. Leave null
   to fall back to a best-effort app-open attempt + manual instructions. */
const INSTAPAY_REQUEST_LINK = null;

/* ====== إعدادات المراجعة اليدوية عبر واتساب — غيّرها قبل النشر ======
   OWNER_WHATSAPP_NUMBER: رقمك بصيغة دولية من غير + ولا أصفار زيادة (مصر = 20 + الرقم من غير الصفر الأول).
   VALID_ACTIVATION_CODES: مجموعة أكواد تفعيل ثابتة. أي واحد فيهم يفتح التقرير.
   طريقة الشغل: العميل بيدفع، بيبعتلك كود العملية اللي ظاهر في الصفحة على واتساب،
   انت تتأكد من التحويل في تطبيق إنستاباي بنفسك، وبعدين تبعتله أي كود من اللستة دي
   (2000 لحد 2010)، هو يكتبه في الخانة فتفتح له الصفحة.
   ملحوظة مهمة: الأكواد دي ثابتة ومكتوبة جوه كود الصفحة، يعني:
   1) أي حد يفتح "View Source" هيقدر يشوفها ويستخدمها من غير ما يدفع.
   2) مفيش تتبع لمين استخدم أنهي كود ولا عدد مرات استخدامه (مفيش باك-إند يحفظ ده)،
      فنفس الكود ممكن يتستخدم أكتر من مرة لو اتسرب.
   ده مناسب لمبلغ صغير زي ده، بس لو حسيت إن الأكواد اتسربت أو اتشاركت، غيّر اللستة دي كلها. */
const OWNER_WHATSAPP_NUMBER = '20' + INSTAPAY_NUMBER.replace(/^0/, '');
const VALID_ACTIVATION_CODES = ['2000','2001','2002','2003','2004','2005','2006','2007','2008','2009','2010'];

function genRefCode(){
  return String(Math.floor(1000 + Math.random()*9000));
}

function attemptOpenInstaPay(){
  if(INSTAPAY_REQUEST_LINK){ window.location.href = INSTAPAY_REQUEST_LINK; return; }
  const start = Date.now();
  const hint = document.getElementById('instapayHint');
  /* Best-effort handoff to the app — there's no public universal scheme guaranteed to
     prefill a recipient, so this may silently fail on some devices; that's why the
     number + manual instructions stay visible either way. */
  window.location.href = 'instapay://';
  setTimeout(()=>{
    if(Date.now()-start < 2500 && document.visibilityState === 'visible' && hint){
      hint.style.display = 'block';
    }
  }, 900);
}

function showPaywall(){
  const refCode = genRefCode();
  const overlay = document.createElement('div');
  overlay.className = 'paywall-overlay';
  overlay.innerHTML = `
    <div class="paywall-card">
      <h3>تقريرك جاهز</h3>
      <p>الدراسة اكتملت. لفتح التقرير الكامل حوّل قيمة التقرير على الرقم اللي تحت، وابعتلي كود العملية بتاعك على واتساب، وأنا أبعتلك كود التفعيل بعد ما أتأكد من التحويل.</p>
      <div class="price-tag"><span class="num">20</span><span class="cur">جنيه مصري / تقرير</span></div>
      <div class="fawry-box">
        <div class="fawry-row"><span>حوّل على الرقم</span>
          <span><span class="fawry-code" id="instapayNum">${INSTAPAY_NUMBER}</span>
          <button class="copy-btn" id="copyNumBtn" type="button">نسخ</button></span>
        </div>
        <div class="fawry-row"><span>كود العملية بتاعك</span>
          <span><span class="fawry-code" id="refCodeDisplay">${refCode}</span>
          <button class="copy-btn" id="copyRefBtn" type="button">نسخ</button></span>
        </div>
      </div>
      <button class="btn-primary" id="openInstapayBtn" style="width:100%;margin-bottom:10px;">١) الدفع عبر إنستاباي</button>
      <div id="instapayHint" style="display:none;font-size:12px;color:var(--amber);margin:0 0 10px;line-height:1.7;">
        التطبيق ماتفتحش تلقائي؟ افتح إنستاباي بنفسك وحوّل على الرقم اللي فوق.
        <a href="https://www.instapay.eg" target="_blank" style="color:var(--gold-soft);text-decoration:underline;">تنزيل التطبيق</a>
      </div>
      <button class="btn-primary" id="waBtn" style="width:100%;background:var(--green);color:#08130D;margin-bottom:18px;">٢) بعتلي كود العملية على واتساب</button>

      <div class="fawry-box" style="margin-bottom:14px;">
        <div class="fawry-row" style="margin-bottom:8px;"><span>٣) هبعتلك كود تفعيل على واتساب بعد التأكيد</span></div>
        <input type="text" id="activationInput" class="num-input" placeholder="اكتب كود التفعيل هنا" style="width:100%;text-align:center;letter-spacing:2px;">
      </div>
      <button class="btn-primary" id="payBtn" style="width:100%;">فتح التقرير</button>
      <div class="paywall-note" id="paywallMsg">مفيش أي تفعيل أوتوماتيك — التقرير هيتفتح بس بالكود اللي هبعتهولك بنفسي بعد ما أشوف التحويل.</div>
    </div>`;
  document.body.appendChild(overlay);

  document.getElementById('openInstapayBtn').addEventListener('click', attemptOpenInstaPay);

  const copyBtn = document.getElementById('copyNumBtn');
  copyBtn.addEventListener('click', ()=>{
    navigator.clipboard?.writeText(INSTAPAY_NUMBER).then(()=>{
      copyBtn.textContent = 'اتنسخ ✓';
      setTimeout(()=>{ copyBtn.textContent = 'نسخ'; }, 1800);
    }).catch(()=>{});
  });

  const copyRefBtn = document.getElementById('copyRefBtn');
  copyRefBtn.addEventListener('click', ()=>{
    navigator.clipboard?.writeText(refCode).then(()=>{
      copyRefBtn.textContent = 'اتنسخ ✓';
      setTimeout(()=>{ copyRefBtn.textContent = 'نسخ'; }, 1800);
    }).catch(()=>{});
  });

  document.getElementById('waBtn').addEventListener('click', ()=>{
    const msg = encodeURIComponent(`السلام عليكم، حوّلت ٢٠ جنيه على إنستاباي، كود العملية بتاعي: ${refCode}`);
    window.open(`https://wa.me/${OWNER_WHATSAPP_NUMBER}?text=${msg}`, '_blank');
  });

  document.getElementById('payBtn').addEventListener('click', ()=>{
    const entered = document.getElementById('activationInput').value.trim();
    const msgEl = document.getElementById('paywallMsg');
    if(entered && VALID_ACTIVATION_CODES.includes(entered)){
      overlay.remove();
      state.paid = true;
      state.screen = 'report';
      render();
    } else {
      msgEl.textContent = 'الكود مش مظبوط. استنى كودك اللي هبعتهولك على واتساب بعد ما أتأكد من التحويل.';
      msgEl.style.color = 'var(--red)';
    }
  });
}

render();
</script>
